# AcmeLIMS runtime configuration (PRODUCTION)
# ---------------------------------------------------------------------------
# NOTE: this file is intentionally full of findings for ModernRx to detect.
# ---------------------------------------------------------------------------

server.port=8080
spring.application.name=acme-lims
spring.thymeleaf.cache=true

# --- Database: connection string hard-coded, file-mode H2 on a local disk ---
spring.datasource.url=jdbc:h2:file:C:/acme/lims/data/limsdb;AUTO_SERVER=TRUE;MODE=Oracle
spring.datasource.username=LIMS_OWNER
spring.datasource.password=Lims#Prod2019
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# --- Shared admin account baked into configuration (security finding) ---
lims.admin.username=limsadmin
lims.admin.password=Acme!Admin2018
lims.admin.bypass.esig=false

# --- Instrument integration: Windows network share (cloud blocker) ---
lims.instrument.inbox=C:\\instrument\\inbox
lims.instrument.archive=\\\\acme-fileserver\\lims\\archive
lims.instrument.poll.cron=0 */5 * * * *

# --- Reporting output: another absolute host path ---
lims.reports.output.dir=C:\\acme\\lims\\reports
lims.reports.logo=C:\\acme\\branding\\acme-logo.png

# --- Peer systems pinned to literal IP addresses ---
lims.mes.endpoint=http://10.20.30.41:9100/mes/api
lims.erp.endpoint=http://10.20.30.55:8200/erp/soap
lims.smtp.host=10.20.30.25
lims.smtp.port=25
lims.ldap.url=ldap://10.20.30.10:389/dc=acme,dc=local
lims.ldap.bind.password=bindSecret99

# --- Session state held in the servlet container (statelessness blocker) ---
server.servlet.session.timeout=240m
server.servlet.session.persistent=true

# --- Scheduler ---
lims.stability.pull.cron=0 0 2 * * *
lims.scheduler.enabled=true

# --- Observability: none configured beyond a file appender ---
logging.file.name=C:\\acme\\lims\\logs\\lims.log
logging.level.root=INFO
